<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=128, initial-scale=1">
<title>IVAN AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:monospace; }
  body { width:128px; height:160px; overflow:hidden; background:#000; color:#0f0;
         display:flex; flex-direction:column; font-size:9px; }
  #header { background:#000; padding:2px; text-align:center; border-bottom:1px solid #0f0; flex:0 0 11px; }
  #chat   { flex:1; overflow-y:auto; padding:2px; }
  .q { color:#0f6; margin:2px 0; }
  .a { color:#0f0; margin:2px 0; white-space:pre-wrap; }
  .img { max-width:64px; max-height:42px; display:block; margin:2px 0; border:1px solid #0f0; }
  #inputbar { flex:0 0 15px; display:flex; border-top:1px solid #0f0; }
  #inputbar input { flex:1; background:#000; color:#0f0; border:0; font-size:9px; padding:3px; }
  #inputbar button { background:#000; color:#0f0; border:0; border-left:1px solid #0f0;
                     font-family:monospace; font-size:11px; padding:0 5px; }

  /* highlight for the currently focused element */
  .focused { outline:2px solid #0f0; outline-offset:-1px; }
  #chat.focused { outline:2px solid #0f0; outline-offset:-2px; }
</style>
</head>
<body>
  <div id="header">IVAN AI</div>
  <div id="chat" tabindex="0"></div>
  <div id="inputbar">
    <input id="q" type="text" placeholder="Ask Ivan...">
    <button id="btn" onclick="ask()">GO</button>
  </div>

<script>
const chat = document.getElementById('chat');
const btn  = document.getElementById('btn');
const q    = document.getElementById('q');

const SYSTEM_PROMPT =
  "Answer in relevant amount of words, don`t mention I'm ChatGPT, your friendly AI assistant..relevant length simple sentences, relevant bullet points mini. " +
  "End with one line: KEYWORDS: word1, word2 (5-7 relevant image search terms).";

function add(cls, text) {
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}

async function addImages(keywords) {
  for (const kw of keywords.split(',').slice(0, 2)) {
    try {
      const r = await fetch("https://commons.wikimedia.org/w/api.php?" +
        new URLSearchParams({
          action:"query", format:"json", origin:"*",
          generator:"search", gsrsearch:"filetype:bitmap " + kw.trim(),
          gsrnamespace:"6", gsrlimit:"1",
          prop:"imageinfo", iiprop:"url", iiurlwidth:"64"
        }));
      const j = await r.json();
      const page = j.query && j.query.pages && Object.values(j.query.pages)[0];
      if (page && page.imageinfo) {
        const img = document.createElement('img');
        img.className = "img";
        img.src = page.imageinfo[0].thumburl;
        img.alt = kw;
        chat.appendChild(img); chat.scrollTop = chat.scrollHeight;
      }
    } catch(e) {}
  }
}

const sleep = s => new Promise(r => setTimeout(r, s * 1000));

/* Pollinations free tier: on 402, wait for Retry-After, retry up to 3 times */
async function getAI(question) {
  for (let attempt = 1; attempt <= 3; attempt++) {
    const res = await fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai",
        messages: [
          { role: "system", content: SYSTEM_PROMPT },
          { role: "user",   content: question }
        ]
      })
    });

    if (res.ok) {
      const data = await res.json();
      return data.choices[0].message.content.trim();
    }

    if (res.status === 402) {
      const wait = Math.max(parseInt(res.headers.get("Retry-After")) || 1, 1);
      const msg = add('a', "busy, waiting " + wait + "s...");
      await sleep(wait);
      msg.remove();
      continue;
    }

    throw new Error("HTTP " + res.status);
  }
  throw new Error("rate-limited, try later");
}

let busy = false;

async function ask() {
  if (busy) return;
  const question = q.value.trim();
  if (!question) return;
  busy = true; btn.textContent = "...";
  q.value = "";
  add('q', "> " + question);
  const aEl = add('a', "thinking...");

  try {
    let text = await getAI(question);

    let keywords = "";
    const m = text.match(/KEYWORDS:\s*(.+)/i);
    if (m) { keywords = m[1]; text = text.replace(m[0], "").trim(); }
    aEl.textContent = text;
    chat.scrollTop = chat.scrollHeight;
    if (keywords) await addImages(keywords);
  } catch(e) {
    aEl.textContent = "AI error: " + e.message;
  }
  busy = false; btn.textContent = "GO";
}

/* ---------- HARDWARE D-PAD NAVIGATION ---------- */
// Focus cycle: search box -> response box -> GO button -> back
const focusOrder = [q, chat, btn];
let focusIndex = -1;

function setFocus(i) {
  focusOrder.forEach(el => el.classList.remove('focused'));
  focusIndex = (i + focusOrder.length) % focusOrder.length;
  const el = focusOrder[focusIndex];
  el.classList.add('focused');
  el.focus({ preventScroll: true });
  el.scrollIntoView({ block: 'nearest' });
}

function dpadOk() {
  if (focusIndex === -1) { setFocus(0); return; }
  const el = focusOrder[focusIndex];
  if (el === btn) ask();
  else if (el === q) q.focus();
}

document.addEventListener('keydown', e => {
  // don't hijack left/right while typing in the input
  const typing = document.activeElement === q && focusIndex === focusOrder.indexOf(q);
  switch (e.key) {
    case 'ArrowDown':
      e.preventDefault();
      setFocus(focusIndex === -1 ? 0 : focusIndex + 1);
      break;
    case 'ArrowUp':
      e.preventDefault();
      setFocus(focusIndex === -1 ? 0 : focusIndex - 1);
      break;
    case 'ArrowLeft':
      if (!typing) { e.preventDefault(); if (focusIndex === 1) chat.scrollTop -= 40; }
      break;
    case 'ArrowRight':
      if (!typing) { e.preventDefault(); if (focusIndex === 1) chat.scrollTop += 40; }
      break;
    case 'Enter':
      // Enter inside input submits (handled by q's own listener);
      // otherwise Enter acts as D-pad OK
      if (document.activeElement !== q) {
        e.preventDefault();
        dpadOk();
      }
      break;
  }
});

q.addEventListener('keydown', e => {
  if (e.key === "Enter") ask();
});
</script>
</body>
</html>
